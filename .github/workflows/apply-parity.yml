name: Apply verified parity source
on:
  push:
    branches: [feat/parity-review-performance]
    paths: ['.github/workflows/apply-parity.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/parity-review-performance
      - name: Reconstruct verified source edits and remove transport files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma, shutil
          packed = b''.join(p.read_bytes() for p in sorted(Path('tools/.parity').iterdir()))
          blob = hashlib.sha1(b'blob ' + str(len(packed)).encode() + b'\0' + packed).hexdigest()
          assert blob == 'a83db8737cefe4279454b6ad2c638adf7ad7f5d0', 'Source transfer checksum mismatch'
          changes = json.loads(lzma.decompress(packed))
          for name, change in changes.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == change['sha256'], 'Base mismatch: ' + name
              lines = original.decode('utf-8').splitlines(keepends=True)
              for first, last, text in reversed(change['ops']):
                  lines[first:last] = [text]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
              print('Applied', name)
          shutil.rmtree('tools/.parity')
          Path('.github/workflows/apply-parity.yml').unlink()
          PY
          git add -A
          actual=$(git write-tree)
          test "$actual" = a5497f9a555c4308410f2066b6c4493eccfdce83
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add guarded partial staging, conflict review and incremental repository UX'
          git push origin HEAD:feat/parity-review-performance
