name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source
        run: |
          mkdir -p artifacts
          git archive --format=zip -o artifacts/GitSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tested-source
          path: artifacts/GitSpace-source.zip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Portable and real system Git regression tests
        run: dotnet run --project tests/GitSpace.Tests -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/GitSpace.BrowserGit/package-lock.json
      - name: Restore locked browser Git dependencies
        run: npm ci --prefix src/GitSpace.BrowserGit --no-audit --no-fund
      - name: Real browser-backend Git contract tests
        run: npm test --prefix src/GitSpace.BrowserGit
      - name: Reproducible refresh benchmark
        run: node tests/browser/performance.mjs | tee artifacts/refresh-benchmark.json
      - name: Bundle isolated browser worker
        run: npm run build --prefix src/GitSpace.BrowserGit
      - uses: actions/upload-artifact@v4
        with:
          name: browser-git-worker
          path: src/GitSpace.BrowserGit/dist
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-benchmark
          path: artifacts/refresh-benchmark.json
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-gitspace-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-gitspace-nuget-
      - name: Build actual Uno desktop application
        run: dotnet build src/GitSpace.App -f net10.0-desktop -c Release -p:GitSpaceTargetFrameworks=net10.0-desktop
      - name: System Git regression tests
        run: dotnet run --project tests/GitSpace.Tests -c Release
