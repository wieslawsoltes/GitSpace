name: Apply reviewed UI refinements
on:
  push:
    branches: [feat/parity-review-performance]
    paths: ['.github/workflows/apply-review-refinements.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/parity-review-performance
      - name: Apply exact source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma
          data = Path('tools/.review-refinements.xz').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '2fec418fce3c565e30b69061424faf29b674668e'
          for name, change in json.loads(lzma.decompress(data)).items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('src', 'tests')
              original = path.read_bytes()
              assert hashlib.sha256(original).hexdigest() == change['sha256'], name
              lines = original.decode().splitlines(keepends=True)
              for first, last, text in reversed(change['ops']):
                  lines[first:last] = [text]
              path.write_bytes(''.join(lines).encode())
              print('Applied', name)
          PY
          git add src tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: refine compact review controls and preserve amended commit bodies'
          git push origin HEAD:feat/parity-review-performance
